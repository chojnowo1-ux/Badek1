name: Build BubbleBot Pro APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract source
        run: |
          unzip -q "$(find . -maxdepth 1 -type f -name 'BubbleBotPro*.zip' -print -quit)"
      - name: Build APK
        working-directory: BubbleBotPro
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BubbleBotPro-APK
          path: BubbleBotPro/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
