name: Build BubbleBot Pro 0.3 APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'BubbleBotPro_0.3.zip'
      - '.github/workflows/build-apk-zip.yml'

jobs:
  android-debug:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Rozpakuj BubbleBot Pro
        run: |
          unzip -t BubbleBotPro_0.3.zip
          mkdir -p project
          unzip -q BubbleBotPro_0.3.zip -d project
          test -f project/BubbleBotPro/app/build.gradle

      - name: Ustaw Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Skonfiguruj Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Zainstaluj Android SDK 35
        run: |
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Skonfiguruj Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Testy rozpoznawania kolorow
        run: bash project/BubbleBotPro/tests/run_tests.sh

      - name: Zbuduj APK
        run: gradle --no-daemon --stacktrace -p project/BubbleBotPro assembleDebug

      - name: Udostepnij APK
        uses: actions/upload-artifact@v4
        with:
          name: BubbleBotPro-v0.3-APK
          path: project/BubbleBotPro/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
